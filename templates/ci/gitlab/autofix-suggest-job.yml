
# --unsafe: the `suggest` fixes, kept apart on their own branch and merge request.
codelaw-autofix-suggest:
  image: node:22
  needs: ["codelaw-autofix"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - apt-get update -qq && apt-get install -y -qq jq curl git > /dev/null
    - if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile; elif [ -f yarn.lock ]; then corepack enable && yarn install --frozen-lockfile; elif [ -f package-lock.json ]; then npm ci; fi
    - npm install --global codelaw@{{version}}
  script:
    - |
      set -u
      rc=0
      codelaw fix --unsafe --as-of "$(date +%F)" --format json > fix.json || rc=$?
      if [ "$rc" -ge 2 ]; then cat fix.json; exit "$rc"; fi
      codelaw format
      if [ -z "$(git status --porcelain)" ]; then echo "Nothing to suggest: no merge request."; exit 0; fi
      {
        echo "Fixes of the suggest class from codelaw fix --unsafe: review each one; they can change behaviour."
        echo
        echo "## Fixes per rule and file"
        jq -r '(.fixed // [])[] | "- `\(.file)`: " + ([.applied[] | "\(.[0]) x\(.[1])"] | join(", "))' fix.json
      } > body.md
      rm fix.json
      git config user.name "codelaw autofix"
      git config user.email "codelaw-autofix@users.noreply.gitlab.com"
      git switch -C codelaw/autofix-suggest
      git add -A
      git reset -q body.md
      git commit -m "codelaw: scheduled autofix (suggest)"
      git push --force "https://oauth2:$CODELAW_AUTOFIX_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git" codelaw/autofix-suggest
      api="$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests"
      iid="$(curl -sf --header "PRIVATE-TOKEN: $CODELAW_AUTOFIX_TOKEN" "$api?state=opened&source_branch=codelaw/autofix-suggest" | jq -r '.[0].iid // empty')"
      if [ -n "$iid" ]; then
        jq -n --rawfile d body.md '{description: $d}' > mr.json
        curl -sf --request PUT --header "PRIVATE-TOKEN: $CODELAW_AUTOFIX_TOKEN" --header "Content-Type: application/json" --data @mr.json "$api/$iid" > /dev/null
      else
        jq -n --rawfile d body.md --arg t "codelaw: scheduled autofix (suggest, review each)" --arg b "$CI_DEFAULT_BRANCH" '{source_branch: "codelaw/autofix-suggest", target_branch: $b, title: $t, description: $d, remove_source_branch: true}' > mr.json
        curl -sf --request POST --header "PRIVATE-TOKEN: $CODELAW_AUTOFIX_TOKEN" --header "Content-Type: application/json" --data @mr.json "$api" > /dev/null
      fi
