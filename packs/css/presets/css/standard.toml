description = "The non-layout rules stylelint-config-standard 40.0.0 adds to the recommended set, reimplemented; use it with css/recommended"

[rules]
"css/alpha-value-notation" = "error"
"css/at-rule-no-vendor-prefix" = "error"
"css/block-no-redundant-nested-style-rules" = "error"
"css/color-function-alias-notation" = "error"
"css/color-function-notation" = "error"
"css/color-hex-length" = "error"
"css/container-name-pattern" = "error"
"css/custom-media-pattern" = "error"
"css/custom-property-pattern" = "error"
"css/declaration-block-no-redundant-longhand-properties" = "error"
"css/hue-degree-notation" = "error"
"css/import-notation" = "error"
"css/keyframe-selector-notation" = "error"
"css/keyframes-name-pattern" = "error"
"css/layer-name-pattern" = "error"
"css/length-zero-no-unit" = "error"
"css/lightness-notation" = "error"
"css/media-feature-name-no-vendor-prefix" = "error"
"css/media-feature-range-notation" = "error"
"css/number-max-precision" = "error"
"css/property-no-vendor-prefix" = "error"
"css/selector-class-pattern" = "error"
"css/selector-id-pattern" = "error"
"css/selector-no-vendor-prefix" = "error"
"css/selector-not-notation" = "error"
"css/selector-pseudo-element-colon-notation" = "error"
"css/shorthand-property-no-redundant-values" = "error"
"css/value-no-vendor-prefix" = "error"
