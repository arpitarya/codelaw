description = "The correctness core of stylelint-config-recommended 18.0.0 (stylelint 17.16.0), reimplemented"

[rules]
"css/annotation-no-unknown" = "error"
"css/at-rule-descriptor-no-unknown" = "error"
"css/at-rule-descriptor-value-no-unknown" = "error"
"css/at-rule-no-deprecated" = "error"
"css/at-rule-no-unknown" = "error"
"css/at-rule-prelude-no-invalid" = "error"
"css/comment-no-empty" = "error"
"css/custom-property-no-missing-var-function" = "error"
"css/declaration-block-no-duplicate-custom-properties" = "error"
"css/declaration-block-no-duplicate-properties" = "error"
"css/declaration-block-no-shorthand-property-overrides" = "error"
"css/declaration-property-value-keyword-no-deprecated" = "error"
"css/declaration-property-value-no-unknown" = "error"
"css/font-family-no-duplicate-names" = "error"
"css/font-family-no-missing-generic-family-keyword" = "error"
"css/function-calc-no-unspaced-operator" = "error"
"css/keyframe-block-no-duplicate-selectors" = "error"
"css/keyframe-declaration-no-important" = "error"
"css/media-feature-name-no-unknown" = "error"
"css/media-feature-name-value-no-unknown" = "error"
"css/media-query-no-invalid" = "error"
"css/media-type-no-deprecated" = "error"
"css/named-grid-areas-no-invalid" = "error"
"css/nesting-selector-no-missing-scoping-root" = "error"
"css/no-descending-specificity" = "error"
"css/no-duplicate-at-import-rules" = "error"
"css/no-duplicate-selector" = "error"
"css/no-empty-block" = "error"
"css/no-empty-source" = "error"
"css/no-invalid-double-slash-comments" = "error"
"css/no-invalid-position-at-import-rule" = "error"
"css/no-invalid-position-declaration" = "error"
"css/no-irregular-whitespace" = "error"
"css/no-unknown-property" = "error"
"css/property-no-deprecated" = "error"
"css/selector-anb-no-unmatchable" = "error"
"css/selector-pseudo-class-no-unknown" = "error"
"css/selector-pseudo-element-no-unknown" = "error"
"css/selector-type-no-unknown" = "error"
"css/string-no-newline" = "error"
"css/syntax-string-no-invalid" = "error"
