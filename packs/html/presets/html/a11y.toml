description = "html-validate 11.16.4 a11y: the accessibility rules and WCAG techniques, reimplemented"

[rules]
"html/area-alt" = "error"
"html/aria-hidden-body" = "error"
"html/aria-label-misuse" = "error"
"html/button-type" = "error"
"html/empty-heading" = "error"
"html/empty-title" = "error"
"html/fieldset-legend" = "error"
"html/form-submit" = "error"
"html/hidden-focusable" = "error"
"html/img-alt" = "error"
"html/img-title" = "error"
"html/input-image-alt" = "error"
"html/link-text" = "error"
"html/meta-refresh" = "error"
"html/multiple-labeled-controls" = "error"
"html/no-abstract-role" = "error"
"html/no-autoplay" = "error"
"html/no-duplicate-id" = "error"
"html/no-redundant-aria-label" = "error"
"html/no-redundant-for" = "error"
"html/no-redundant-role" = "error"
"html/prefer-native-element" = "error"
"html/text-content" = "error"
"html/th-scope" = "error"
"html/unique-landmark" = "error"
"html/valid-autocomplete" = "error"
