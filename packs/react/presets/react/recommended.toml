description = "eslint-plugin-react 7.37.5 recommended with jsx-runtime, eslint-plugin-react-hooks 7.1.1 rules-of-hooks and exhaustive-deps and eight of its React Compiler rules, and two of @eslint-react 5.28.8's hooks rules, reimplemented"

[rules]
"react/display-name" = "error"
"react/error-boundaries" = "error"
"react/exhaustive-deps" = "error"
"react/globals" = "error"
"react/jsx-key" = "error"
"react/jsx-no-comment-textnodes" = "error"
"react/jsx-no-duplicate-props" = "error"
"react/jsx-no-target-blank" = "error"
"react/jsx-no-undef" = "error"
"react/no-children-prop" = "error"
"react/no-danger-with-children" = "error"
"react/no-deprecated" = "error"
"react/no-direct-mutation-state" = "error"
"react/no-find-dom-node" = "error"
"react/no-is-mounted" = "error"
"react/no-nested-components" = "error"
"react/no-ref-in-render" = "error"
"react/no-render-return-value" = "error"
"react/no-set-state-in-effect" = "error"
"react/no-set-state-in-render" = "error"
"react/no-string-refs" = "error"
"react/no-unescaped-entities" = "error"
"react/no-unknown-property" = "error"
"react/no-unnecessary-use-prefix" = "warn"
"react/prefer-lazy-state-init" = "warn"
"react/purity" = "error"
"react/require-render-return" = "error"
"react/rules-of-hooks" = "error"
"react/use-memo" = "error"
