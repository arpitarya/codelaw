description = "typescript-eslint's type-checked rules, answered by the project's own TypeScript ≥ 7.1 (SR-TYPES); every rule is preview until TypeScript 7.1 is GA"

[rules]
"ts/await-thenable" = "error"
"ts/no-floating-promises" = "error"
"ts/no-unsafe-call" = "error"
"ts/no-unsafe-member-access" = "error"
"ts/no-unsafe-return" = "error"
"ts/type-error" = "error"
