description = "typescript-eslint's recommended preset (8.71.2, not type-checked), reimplemented, with the core rules it switches on for TypeScript"

[rules]
"ts/ban-ts-comment" = "error"
"ts/no-array-constructor" = "error"
"ts/no-duplicate-enum-values" = "error"
"ts/no-empty-object-type" = "error"
"ts/no-explicit-any" = "error"
"ts/no-extra-non-null-assertion" = "error"
"ts/no-misused-new" = "error"
"ts/no-namespace" = "error"
"ts/no-non-null-asserted-optional-chain" = "error"
"ts/no-require-imports" = "error"
"ts/no-this-alias" = "error"
"ts/no-unnecessary-type-constraint" = "error"
"ts/no-unsafe-declaration-merging" = "error"
"ts/no-unsafe-function-type" = "error"
"ts/no-unused-expressions" = "error"
"ts/no-unused-vars" = "error"
"ts/no-wrapper-object-types" = "error"
"ts/prefer-as-const" = "error"
"ts/prefer-namespace-keyword" = "error"
"ts/triple-slash-reference" = "error"
"js/no-var" = "error"
"js/prefer-const" = "error"
"js/prefer-rest-params" = "error"
"js/prefer-spread" = "error"
