description = "The non-layout rules of markdownlint 0.42.0's default set, reimplemented (layout belongs to the formatter), and the starter rule md/relative-links"

[rules]
"md/commands-show-output" = "warn"
"md/descriptive-link-text" = "warn"
"md/fence-language" = "warn"
"md/first-line-heading" = "warn"
"md/heading-increment" = "warn"
"md/link-fragments" = "error"
"md/link-image-reference-definitions" = "warn"
"md/no-alt-text" = "warn"
"md/no-bare-urls" = "warn"
"md/no-duplicate-heading" = "warn"
"md/no-emphasis-as-heading" = "warn"
"md/no-empty-links" = "error"
"md/no-reversed-links" = "error"
"md/reference-links-images" = "error"
"md/relative-links" = "error"
"md/single-h1" = "warn"
"md/table-column-count" = "error"
