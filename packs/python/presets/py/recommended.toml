description = "Ruff 0.17.1's long-standing default (E4, E7, E9, F) plus flake8-bugbear (B), isort's import order (I001) and sorted __all__ (RUF022), reimplemented"

[rules]
"py/abstract-base-class-without-abstract-method" = "error"
"py/all-sorted" = "error"
"py/ambiguous-class-name" = "error"
"py/ambiguous-function-name" = "error"
"py/ambiguous-variable-name" = "error"
"py/assert-false" = "error"
"py/assert-raises-exception" = "error"
"py/assert-tuple" = "error"
"py/assignment-to-os-environ" = "error"
"py/batched-without-explicit-strict" = "error"
"py/break-outside-loop" = "error"
"py/cached-instance-method" = "error"
"py/continue-outside-loop" = "error"
"py/default-except-not-last" = "error"
"py/duplicate-dict-key" = "error"
"py/duplicate-dict-key-variable" = "error"
"py/duplicate-handler-exception" = "error"
"py/duplicate-set-value" = "error"
"py/duplicate-try-block-exception" = "error"
"py/empty-method-without-abstract-decorator" = "error"
"py/except-with-empty-tuple" = "error"
"py/except-with-non-exception-classes" = "error"
"py/f-string-docstring" = "error"
"py/f-string-missing-placeholders" = "error"
"py/format-invalid" = "error"
"py/format-missing-argument" = "error"
"py/format-mixed-numbering" = "error"
"py/format-unused-named-argument" = "error"
"py/format-unused-positional-argument" = "error"
"py/forward-annotation-syntax-error" = "error"
"py/function-call-in-default-argument" = "error"
"py/function-uses-loop-variable" = "error"
"py/getattr-with-constant" = "error"
"py/if-tuple" = "error"
"py/import-shadowed-by-loop-var" = "error"
"py/invalid-print-syntax" = "error"
"py/is-literal" = "error"
"py/jump-statement-in-finally" = "error"
"py/lambda-assignment" = "error"
"py/late-future-import" = "error"
"py/loop-variable-overrides-iterator" = "error"
"py/map-without-explicit-strict" = "error"
"py/module-import-not-at-top" = "error"
"py/multiple-imports-on-one-line" = "error"
"py/multiple-starred-expressions" = "error"
"py/mutable-contextvar-default" = "error"
"py/nested-star-import" = "error"
"py/no-bare-except" = "error"
"py/no-explicit-stacklevel" = "error"
"py/no-mutable-default" = "error"
"py/no-star-import" = "error"
"py/none-comparison" = "error"
"py/not-in-test" = "error"
"py/not-is-test" = "error"
"py/percent-format-count-mismatch" = "error"
"py/percent-format-expected-mapping" = "error"
"py/percent-format-expected-sequence" = "error"
"py/percent-format-invalid" = "error"
"py/percent-format-missing-argument" = "error"
"py/percent-format-mixed-placeholders" = "error"
"py/percent-format-star-requires-sequence" = "error"
"py/percent-format-unsupported-character" = "error"
"py/percent-format-unused-named-argument" = "error"
"py/raise-literal" = "error"
"py/raise-not-implemented" = "error"
"py/raise-without-from-inside-except" = "error"
"py/re-sub-positional-args" = "error"
"py/redefined-while-unused" = "error"
"py/redundant-tuple-in-exception-handler" = "error"
"py/return-outside-function" = "error"
"py/reuse-of-groupby-generator" = "error"
"py/setattr-with-constant" = "error"
"py/star-arg-unpacking-after-keyword-arg" = "error"
"py/star-import-usage" = "error"
"py/static-key-dict-comprehension" = "error"
"py/strip-with-multi-characters" = "error"
"py/too-many-expressions-in-star-assignment" = "error"
"py/true-false-comparison" = "error"
"py/type-comparison" = "error"
"py/unary-prefix-increment" = "error"
"py/undefined-export" = "error"
"py/undefined-future-feature" = "error"
"py/undefined-local" = "error"
"py/undefined-name" = "error"
"py/unintentional-type-annotation" = "error"
"py/unreliable-callable-check" = "error"
"py/unsorted-imports" = "error"
"py/unused-annotation" = "error"
"py/unused-import" = "error"
"py/unused-loop-control-variable" = "error"
"py/unused-variable" = "error"
"py/useless-comparison" = "error"
"py/useless-contextlib-suppress" = "error"
"py/useless-expression" = "error"
"py/yield-outside-function" = "error"
"py/zip-without-explicit-strict" = "error"

[scope.tests]
files = ["**/tests/**", "**/test_*.py", "**/*_test.py"]
