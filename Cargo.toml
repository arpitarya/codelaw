# The codelaw engine: one Cargo workspace, one binary (SR-PACKAGES decision 1).
# Every crate carries this version (L6 decision 9); the layer order is checked
# by crates/codelaw-cli/tests/layers.rs (SR-ARCHITECTURE decision 1).
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.3"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
codelaw-core = { path = "crates/codelaw-core" }
codelaw-cache = { path = "crates/codelaw-cache" }
codelaw-config = { path = "crates/codelaw-config" }
codelaw-lang = { path = "crates/codelaw-lang" }
codelaw-rules = { path = "crates/codelaw-rules" }
codelaw-semantic = { path = "crates/codelaw-semantic" }
codelaw-match = { path = "crates/codelaw-match" }
codelaw-native = { path = "crates/codelaw-native" }
codelaw-fix = { path = "crates/codelaw-fix" }
codelaw-graph = { path = "crates/codelaw-graph" }
codelaw-adapters = { path = "crates/codelaw-adapters" }
codelaw-baseline = { path = "crates/codelaw-baseline" }
codelaw-engine = { path = "crates/codelaw-engine" }
codelaw-report = { path = "crates/codelaw-report" }
codelaw-test = { path = "crates/codelaw-test" }
codelaw-lsp = { path = "crates/codelaw-lsp" }
codelaw-mcp = { path = "crates/codelaw-mcp" }
codelaw-agents = { path = "crates/codelaw-agents" }
codelaw-format = { path = "crates/codelaw-format" }
codelaw-types = { path = "crates/codelaw-types" }

# Grammars and matcher: pinned (SR-ARCHITECTURE decision 3). All MIT.
ast-grep-core = { version = "=0.51.0", features = ["tree-sitter"] }
ast-grep-config = { version = "=0.51.0" }
ast-grep-language = { version = "=0.51.0", default-features = false, features = [
  "tree-sitter-javascript",
  "tree-sitter-typescript",
  "tree-sitter-python",
  "tree-sitter-json",
  "tree-sitter-yaml",
  "tree-sitter-md",
  "tree-sitter-css",
  "tree-sitter-html",
] }
tree-sitter = "=0.27.0"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-md = "=0.5.3"
# tree-sitter-scss: codelaw's in-tree copy of 1.0.0 (MIT); L11's list (records/0013_LAW-11-dependencies.md) D-33.
tree-sitter-scss = { path = "crates/codelaw-lang/grammars/tree-sitter-scss" }

bit-set = "0.11"
blake3 = "1.8"
# Tests only: validates codelaw.schema.json and SARIF output (SR-CONFIG decision 6,
# SR-CLI-MCP decision 4). MIT OR Apache-2.0.
boon = "=0.6.1"
clap = { version = "4.6", features = ["derive"] }
globset = "0.4.20"
libc = "0.2"
ignore = "0.4.33"
# The language server (SR-EDITOR decision 1): rust-analyzer's scaffold and
# the protocol types. lsp-server is MIT OR Apache-2.0, lsp-types is MIT.
lsp-server = "0.10.0"
lsp-types = "0.97.0"
pulldown-cmark = { version = "0.13", default-features = false }
rayon = "1.12"
regex = "1.10"
semver = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = "2.0"
toml = "1.1"

# L2: Biome reaches the MPL-2.0 `option-ext` through `directories`; this MIT
# stand-in replaces it (SR-FORMATTER decision 2).
# tree-sitter-css: codelaw's in-tree fork of 0.25.0 (MIT), which reads range
# media features, `layer` in `@import` and fractional keyframe percentages;
# dropped once upstream releases the same (SR-ARCHITECTURE decision 3).
[patch.crates-io]
option-ext = { path = "crates/codelaw-format/shims/option-ext" }
tree-sitter-css = { path = "crates/codelaw-lang/grammars/tree-sitter-css" }

[profile.release]
lto = "thin"
codegen-units = 1
