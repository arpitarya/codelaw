version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
codelaw-core.workspace = true
codelaw-lang.workspace = true
codelaw-semantic.workspace = true
regex.workspace = true
# `data/outdated-dependency` (SR-RULE-PACKS decision 15): npm versions, the
