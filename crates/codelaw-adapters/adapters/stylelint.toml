# stylelint (MIT) — SR-LINTER decision 2: available, run when named.
# `--compute-edit-info` puts the autofix in the JSON (offsets in UTF-16 code
# units): such a finding is `auto`, the rest `manual`. stylelint 16 removed
# its stylistic rules, so no layout-only rule reaches the report (SR-LINTER
# decision 7). The report is printed on stderr when there are problems.
name = "stylelint"
binary = "stylelint"
licence = "MIT"
default = false
languages = ["css"]
version_args = ["--version"]
args = ["--formatter", "json", "--compute-edit-info", "--allow-empty-input"]
# The fixtures were captured from 17.16.0 (tests/fixtures/stylelint);
# `--compute-edit-info` is 16.15+.
tested = ">=17.16.0, <18.0.0"
output = "stylelint"
ported_prefix = "stylelint/"
docs = "https://stylelint.io/user-guide/rules/{rule}"
# The files whose content enters each cache key (SR-ARCHITECTURE decision 19),
# looked for in every folder from the file's up to the project root.
config_files = [
  ".stylelintrc", ".stylelintrc.json", ".stylelintrc.yaml", ".stylelintrc.yml",
  ".stylelintrc.js", ".stylelintrc.cjs", ".stylelintrc.mjs",
  "stylelint.config.js", "stylelint.config.cjs", "stylelint.config.mjs", "stylelint.config.ts",
  ".stylelintignore", "package.json",
]
