# oxlint (MIT) — SR-LINTER decision 2: on by default when installed.
# Its JSON carries no edits, so every finding is `manual` and its steps link
# the rule's docs (L4 decision 9). Spans are UTF-8 byte offsets.
name = "oxlint"
binary = "oxlint"
licence = "MIT"
default = true
languages = ["javascript", "jsx", "typescript", "tsx"]
version_args = ["--version"]
args = ["--format=json"]
# The fixtures were captured from 1.89.0 (tests/fixtures/oxlint).
tested = ">=1.89.0, <2.0.0"
output = "oxlint"
# `eslint(no-debugger)` is `adapter/oxlint/eslint/no-debugger` and is the
# same finding as a codelaw rule `ported_from: [eslint/no-debugger]`.
ported_prefix = ""
# oxlint's `typescript(no-floating-promises)` is typescript-eslint's rule,
# which the `ts` pack names `typescript-eslint/<rule>` in `ported_from:`
# (W-107; oxc's own docs link it under `rules/typescript/`).
ported_plugins = { typescript = "typescript-eslint" }
# The files whose content enters each cache key (SR-ARCHITECTURE decision 19),
# looked for in every folder from the file's up to the project root.
config_files = [".oxlintrc.json", "oxlint.config.ts"]
# `options.typeAware` (oxlint-tsgolint, W-107) checks a file against the
# whole program's types, which no per-file key covers: with it, oxlint's
# results are not cached.
uncached_when = "typeAware"
