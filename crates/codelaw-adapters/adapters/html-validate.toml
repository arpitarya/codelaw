# html-validate (MIT) — SR-LINTER decision 2: available, run when named.
# It offers no autofix, so every finding is `manual` with the rule's docs.
# Lines and columns count UTF-16 code units.
name = "html-validate"
binary = "html-validate"
licence = "MIT"
default = false
languages = ["html"]
version_args = ["--version"]
args = ["--formatter", "json"]
