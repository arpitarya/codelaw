# Ruff (MIT) — SR-LINTER decision 2: on by default when installed.
# `--no-fix` so a project's `fix = true` never makes `check` write. Edits come
# back in the JSON with an applicability: safe → auto, unsafe → suggest,
# display-only or none → manual (L4 decision 9). Columns count code points.
name = "ruff"
binary = "ruff"
licence = "MIT"
default = true
languages = ["python"]
version_args = ["--version"]
args = ["check", "--output-format=json", "--no-cache", "--no-fix", "--exit-zero", "--force-exclude"]
# The fixtures were captured from 0.16.9 (tests/fixtures/ruff); Ruff's minor
# releases change rules.
tested = ">=0.16.9, <0.17.0"
output = "ruff"
ported_prefix = "ruff/"
# The files whose content enters each cache key (SR-ARCHITECTURE decision 19),
# looked for in every folder from the file's up to the project root.
config_files = ["ruff.toml", ".ruff.toml", "pyproject.toml"]
