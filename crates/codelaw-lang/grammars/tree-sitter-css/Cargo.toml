# codelaw's in-tree fork of tree-sitter-css 0.25.0 (MIT, see LICENSE), which
# ast-grep-language pulls in; the root manifest's [patch.crates-io] puts this
# in its place (SR-ARCHITECTURE decision 3, SR-PACKAGES decision 1). The fork
# adds range media features, `layer` in `@import` and fractional keyframe
# percentages; README.md says what changed, how to regenerate src/parser.c,
# and when the fork is dropped (Arpit, 2026-10-22).
#
# Upstream's manifest otherwise unchanged. The version keeps upstream's 0.25.0
# so ast-grep-language's `0.25.0` requirement still matches; `+codelaw.1`
# marks the fork and is bumped with every change to grammar.js.
[package]
name = "tree-sitter-css"
description = "CSS grammar for tree-sitter (codelaw's fork of 0.25.0)"
version = "0.25.0+codelaw.1"
authors = [
  "Max Brunsfeld <maxbrunsfeld@gmail.com>",
  "Amaan Qureshi <contact@amaanq.com>",
]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "css"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/tree-sitter/tree-sitter-css"
edition = "2021"
autoexamples = false
publish = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25"
