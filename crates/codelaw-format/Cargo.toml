[package]
name = "codelaw-format"
description = "The embedded formatter engines and the format verifier (SR-FORMATTER)"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The engines SR-FORMATTER decision 2 names, each pinned exactly; an engine
# upgrade is a deliberate, corpus-gated change (decision 7). Bump
# ENGINES_FINGERPRINT in src/lib.rs with any of them.
[dependencies]
codelaw-core.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
toml.workspace = true
# `.editorconfig` section globs (decision 5).
globset.workspace = true
# Biome 2.5.15 (tag `@biomejs/biome@2.5.15`): the crates.io copies are stale.
biome_formatter = { git = "https://github.com/biomejs/biome", rev = "0b4c11f553a7e702f9851af139662e1de45dc131" }
biome_languages = { git = "https://github.com/biomejs/biome", rev = "0b4c11f553a7e702f9851af139662e1de45dc131", features = ["lang_js", "lang_json", "lang_css"] }
biome_js_formatter = { git = "https://github.com/biomejs/biome", rev = "0b4c11f553a7e702f9851af139662e1de45dc131" }
biome_js_parser = { git = "https://github.com/biomejs/biome", rev = "0b4c11f553a7e702f9851af139662e1de45dc131" }
biome_json_formatter = { git = "https://github.com/biomejs/biome", rev = "0b4c11f553a7e702f9851af139662e1de45dc131" }
biome_json_parser = { git = "https://github.com/biomejs/biome", rev = "0b4c11f553a7e702f9851af139662e1de45dc131" }
biome_css_formatter = { git = "https://github.com/biomejs/biome", rev = "0b4c11f553a7e702f9851af139662e1de45dc131" }
biome_css_parser = { git = "https://github.com/biomejs/biome", rev = "0b4c11f553a7e702f9851af139662e1de45dc131" }
# Ruff publishes its internal crates to crates.io; 0.0.18 is Ruff 0.17.1's.
ruff_formatter = "=0.0.18"
ruff_python_formatter = "=0.0.18"
ruff_python_parser = "=0.0.18"
# The statement tree the ignore markers need (decision 6).
ruff_python_ast = "=0.0.18"
ruff_text_size = "=0.0.18"
pretty_yaml = "=0.6.0"
taplo = { version = "=0.14.0", default-features = false }
dprint-plugin-markdown = "=0.26.0"
dprint-core = { version = "=0.70.0", default-features = false }
markup_fmt = "=0.27.6"
