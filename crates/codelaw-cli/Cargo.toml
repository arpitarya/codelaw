[package]
name = "codelaw-cli"
description = "The `codelaw` binary: a thin translation from the command line to codelaw-engine (SR-CLI-MCP)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "codelaw"
path = "src/main.rs"

[dependencies]
codelaw-core.workspace = true
codelaw-cache.workspace = true
codelaw-config.workspace = true
codelaw-lang.workspace = true
codelaw-rules.workspace = true
codelaw-match.workspace = true
codelaw-fix.workspace = true
codelaw-engine.workspace = true
codelaw-baseline.workspace = true
codelaw-graph.workspace = true
codelaw-report.workspace = true
codelaw-test.workspace = true
codelaw-lsp.workspace = true
codelaw-mcp.workspace = true
codelaw-agents.workspace = true
clap.workspace = true
serde_json.workspace = true
toml.workspace = true
tree-sitter.workspace = true
ignore.workspace = true
# `codelaw format --diff` (SR-FORMATTER decision 1).
similar = "=2.7.0"
# `codelaw bench` (SR-LAW-8): the workload's digest, and the peak memory of a child (`wait4`).
blake3.workspace = true
libc.workspace = true
# `codelaw format --import-config` writes `[format]` into the config, keeping
# the rest of the file as written (SR-FORMATTER decision 5). MIT OR Apache-2.0.
toml_edit = "0.25"
codelaw-format.workspace = true

[dev-dependencies]
toml.workspace = true
# The panic fixture of SR-ARCHITECTURE decision 25 (test builds only).
codelaw-native = { workspace = true, features = ["fault-injection"] }
boon.workspace = true
