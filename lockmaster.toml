# codelaw's landing rules — lockmaster SR-ARCHITECTURE decision 13 (lockmaster W-09, 2026-10-26).
# Read by `lockmaster` from the main checkout. Every landing runs [checks] in a fresh
# worktree with nothing built, so only the stdlib-Python checks of CI's `lint` job are
# here; cargo, the packs and the packaging stay in CI (.github/workflows/ci.yml).
# `scripts/docs-sync.py --check` belongs here too once main is green on it — on
# 2026-10-26 it is red (CHANGELOG.md does not name W-45 and W-47), and a red check
# would stop every landing.

[main]
branch = "main"

[checks]
versions = "python3 -B scripts/version.py --check"
work-system = "python3 -B scripts/check-work-system.py"
inbox = "python3 -B scripts/check-open-work-inbox.py"

[merge]
"work/WORKLOG.md" = "append-newest-first"
"work/LESSONS.md" = "append-newest-first"
"work/IMPLEMENTATION.md" = "append-newest-first"
"work/OPEN-WORK.md" = "table-rows"
"work/BACKLOG.md" = "table-rows"
"archive/README.md" = "table-rows"
