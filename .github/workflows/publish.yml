# Publishing (L6 decision 9; SR-PACKAGES; how to cut one: RELEASING.md). Runs
# when a GitHub Release is published — both registries — or by hand on a `v*`
# tag, npm only, so a release can reach npm while PyPI's first uploads are still
# made by hand (L6 decision 9, the decider 2026-10-25). The Release on that same
# tag later runs both, skipping every version already published. Or by hand from
# main with `only=pypi-new`: ONE new PyPI project, from a release's build, through
# its pending publisher (W-119). Nothing else publishes. No token anywhere: npm and PyPI trusted publishing (OIDC).
#
# Nothing is built here. ci.yml assembled and checked `dist` on the release
# commit; this downloads THAT artifact, re-runs the checks, and uploads it.
#
# Every `run:` is `bash -eo pipefail`; every action is pinned by commit SHA,
# and npm by exact version (W-18). The `npm` and `pypi` environments accept
# only `v*` tags (a deployment rule set by the decider: RELEASING.md).
#
# ⚠ Do NOT rename this file or the `npm` / `pypi` environments. Every trusted
#   publisher on npmjs.com and pypi.org is bound to `arpitarya/codelaw` ·
#   `publish.yml` · its environment, and a rename fails the next release at the
#   registry for a reason no diff shows.
name: publish
on:
  release:
    types: [published]
  workflow_dispatch: # npm only, from a v* tag: `gh workflow run publish.yml --ref v0.2.0`; or `-f only=vscode` from main: the extension's job alone (W-95); or `-f only=pypi-new` from main (W-119)
    inputs:
      only:
        description: 'npm (default, from a v* tag), vscode (the extension alone, from main) or pypi-new (one new PyPI project, from main)'
        type: choice
        options: [npm, vscode, pypi-new]
        default: npm
      release:
        description: 'pypi-new: the v* tag whose build is uploaded (v0.3.0)'
        type: string
        default: ''
      project:
        description: 'pypi-new: the one PyPI project to create (codelaw-rules-scss); its pending publisher must be registered'
        type: string
        default: ''
permissions:
  contents: read
defaults:
  run:
    shell: bash # an explicit `bash` is `bash --noprofile --norc -eo pipefail`; the implicit default has no pipefail
env:
  NPM_VERSION: '11.21.0' # trusted publishing needs ≥ 11.5.1; Node 22 ships npm 10. Pinned: never `latest` in an id-token job
jobs:
  gate:
    name: the release commit is green on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # ci.yml's verdict and its dist artifact
      attestations: read # ci.yml's build attestation of every file
    outputs:
      run: ${{ steps.ci.outputs.run }}
      sums: ${{ steps.verified.outputs.sums }}
      sha: ${{ steps.rel.outputs.sha }}
    steps:
      - id: rel
        name: the release commit — this run's, or with pypi-new the commit of the named v* tag (W-119)
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only }}
          RELEASE: ${{ inputs.release }}
          PROJECT: ${{ inputs.project }}
        run: |
          if [ "$ONLY" != pypi-new ]; then
            [ -z "$RELEASE$PROJECT" ] || { echo "::error::release and project are for only=pypi-new"; exit 1; }
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"; exit 0
          fi
          [[ "$RELEASE" =~ ^v[0-9] ]] || { echo "::error::pypi-new needs -f release=vX.Y.Z (got '${RELEASE}')"; exit 1; }
          [[ "$PROJECT" =~ ^codelaw-[a-z0-9-]+$ ]] || { echo "::error::pypi-new needs -f project=codelaw-… (got '${PROJECT}')"; exit 1; }
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE" -q .sha)"
          echo "pypi-new: $PROJECT from $RELEASE (${sha::8})"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.rel.outputs.sha }} # the release's own scripts check the release's own build
          persist-credentials: false # nothing here pushes (W-18)
      - name: a run by hand is npm only, and starts from a v* tag (L6 decision 9)
        if: github.event_name == 'workflow_dispatch' && inputs.only == 'npm'
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] && [[ "$GITHUB_REF_NAME" == v* ]] || {
            echo "::error::run publish.yml from a v* tag (gh workflow run publish.yml --ref vX.Y.Z), not the ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}"
            exit 1
          }
          echo "npm only: PyPI and the release checksums wait for the GitHub Release on ${GITHUB_REF_NAME}"
      - id: ci
        name: ci.yml succeeded on this commit, on main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.rel.outputs.sha }}
        run: |
          read -r run got < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&branch=main&event=push&per_page=1" \
            -q '.workflow_runs[0] | "\(.id) \(.status)/\(.conclusion)"')
          echo "ci.yml on ${SHA::8} (main): run ${run:-none}, ${got:-no run}"
          [ "$got" = "completed/success" ] || {
            echo "::error::refusing to publish: ci.yml has not succeeded on ${SHA::8} on main (${got:-no run}). Wait for it or fix it, then re-run this job."
            exit 1
          }
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: the tag is the version, and every copy agrees (W-18)
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if [ "${{ inputs.only }}" = vscode ]; then python3 scripts/version.py --check; else python3 scripts/version.py --check --tag "${RELEASE:-$GITHUB_REF_NAME}"; fi
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/
          run-id: ${{ steps.ci.outputs.run }}
          github-token: ${{ github.token }}
      - name: the release checks, again, on exactly what will be uploaded (SHA256SUMS included)
        run: python3 scripts/package.py check dist
      - id: verified
        name: every file is the one ci.yml built and attested, from this commit, on main (SR-PACKAGES decision 11)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.rel.outputs.sha }}
        run: |
          for f in dist/npm/* dist/pypi/*; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --source-ref refs/heads/main --source-digest "$SHA" >/dev/null
            echo "✓ $f"
          done
          echo "sums=$(sha256sum dist/SHA256SUMS | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - name: the engine has its formatter, MCP server and LSP — L7 and L6 decision 3 forbid releasing without them
        run: python3 scripts/law-gate.py dist

  trust:
    # Both registries wait on this, so an npm package that does not trust this
    # workflow stops the release before PyPI or npm receives anything.
    name: npm trusts this workflow, before either registry is written
    needs: gate
    if: github.event_name == 'release' || inputs.only == 'npm'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write # the same OIDC exchange npm publish makes; it publishes nothing
      actions: read
    environment:
      name: npm # the OIDC token's environment claim must be the one npm trusts
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/
          run-id: ${{ needs.gate.outputs.run }}
          github-token: ${{ github.token }}
      - name: npm ${{ env.NPM_VERSION }} (trusted publishing needs ≥ 11.5.1; Node 22 ships npm 10)
        run: npm i -g "npm@$NPM_VERSION" --no-audit --no-fund --loglevel=error && npm --version
      - name: npm trusts this workflow for every package, before anything is published
        # The same OIDC exchange `npm publish` makes, per package: a package npm does
        # not trust would otherwise fail mid-loop and leave the release half on npm.
        run: |
          bad=0
          for t in ./dist/npm/*.tgz; do
            read -r name ver < <(tar -xzOf "$t" package/package.json | node -e 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); console.log(p.name, p.version)')
            npm view "$name@$ver" version >/dev/null 2>&1 && { echo "✓ $name@$ver is already on npm"; continue; }
            idt="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).value')"
            code="$(curl -sS -o "$RUNNER_TEMP/oidc.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $idt" \
                    "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${name/\//%2f}")"
            if [ "${code:0:1}" = 2 ]; then echo "✓ $name trusts publish.yml"; else
              echo "::error::$name — npm refused the OIDC exchange (HTTP $code)"; bad=1; fi
          done
          rm -f "$RUNNER_TEMP/oidc.json"
          [ "$bad" = 0 ] || { echo "::error::Nothing was published. Run scripts/npm-trust.sh once (RELEASING.md), then re-run this workflow."; exit 1; }

  npm:
    needs: [gate, trust]
    if: github.event_name == 'release' || inputs.only == 'npm'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # the OIDC token npm trusted publishing exchanges, and provenance
      contents: read
      actions: read
    environment:
      name: npm
      url: https://www.npmjs.com/package/codelaw
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/
          run-id: ${{ needs.gate.outputs.run }}
          github-token: ${{ github.token }}
      - name: npm ${{ env.NPM_VERSION }} (trusted publishing needs ≥ 11.5.1; Node 22 ships npm 10)
        run: npm i -g "npm@$NPM_VERSION" --no-audit --no-fund --loglevel=error && npm --version
      - name: the download is the set the gate verified (SHA256SUMS, W-18)
        env:
          SUMS: ${{ needs.gate.outputs.sums }}
        run: |
          echo "$SUMS  dist/SHA256SUMS" | sha256sum --strict --quiet -c
          (cd dist && sha256sum --strict --quiet -c SHA256SUMS)
          [ "$(find dist/npm dist/pypi -type f | wc -l)" = "$(wc -l < dist/SHA256SUMS)" ] || { echo "::error::dist holds a file SHA256SUMS does not list"; exit 1; }
      - name: publish — the eight binaries, the npm packs, codelaw, then @codelaw/skills
        # codelaw names the binaries as optionalDependencies, so it goes after them: a
        # failure before it leaves the previous codelaw as `latest`, intact.
        # @codelaw/skills depends on codelaw at its exact version (W-77), so it
        # goes after codelaw, never before the engine it needs.
        # The dist-tag, one for the whole release:
        #   a pre-release (a version with "-")          → `next`, never `latest`
        #   older than codelaw's current `latest` (a backport, 0.1.5 after 0.2.0)
        #                                               → `release-<major>.<minor>`, so `latest` stays on the newer line
        #   otherwise                                   → `latest`
        # A version already on npm is skipped, so a failed run is re-run, not re-released.
        run: |
          v="${GITHUB_REF_NAME#v}"
          cur="$(npm view codelaw dist-tags.latest 2>/dev/null || true)"
          case "$v" in
            *-*) tag=next ;;
            *) if [ -n "$cur" ] && [ "$cur" != "$v" ] && [ "$(printf '%s\n%s\n' "$cur" "$v" | sort -V | tail -1)" = "$cur" ]; then
                 tag="release-$(echo "$v" | cut -d. -f1-2)"
               else tag=latest; fi ;;
          esac
          echo "dist-tag: $tag (codelaw's latest is ${cur:-none})"
          for t in ./dist/npm/codelaw-cli-*.tgz ./dist/npm/codelaw-rules-*.tgz ./dist/npm/codelaw-[0-9]*.tgz ./dist/npm/codelaw-skills-*.tgz; do
            id="$(tar -xzOf "$t" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); p.name + "@" + p.version')"
            [ "${id##*@}" = "$v" ] || { echo "::error::$id is not the release version $v"; exit 1; }  # the version after the LAST @
            if npm view "$id" version >/dev/null 2>&1; then echo "✓ $id is already on npm"; continue; fi
            echo "→ $id ($tag)"
            npm publish "$t" --tag "$tag" --provenance --access public
          done

  pypi:
    # A Release uploads every wheel whose project exists; a run by hand with
    # only=pypi-new uploads one new project, from main (W-119). Any other run by
    # hand is npm only (L6 decision 9).
    needs: [gate, trust]
    if: ${{ !cancelled() && needs.gate.result == 'success' && (github.event_name == 'release' && needs.trust.result == 'success' || inputs.only == 'pypi-new') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # PyPI trusted publishing
      actions: read
    environment:
      name: pypi # tag rule v* and branch main (W-119, the decider 2026-10-29)
      url: https://pypi.org/project/${{ inputs.project || 'codelaw' }}/
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/
          run-id: ${{ needs.gate.outputs.run }}
          github-token: ${{ github.token }}
      - name: the download is the set the gate verified (SHA256SUMS, W-18)
        env:
          SUMS: ${{ needs.gate.outputs.sums }}
        run: |
          echo "$SUMS  dist/SHA256SUMS" | sha256sum --strict --quiet -c
          (cd dist && sha256sum --strict --quiet -c SHA256SUMS)
          [ "$(find dist/npm dist/pypi -type f | wc -l)" = "$(wc -l < dist/SHA256SUMS)" ] || { echo "::error::dist holds a file SHA256SUMS does not list"; exit 1; }
      - name: pypi-new, a Fux index project — the same run's fux-index artifact (built beside dist, not attested; SR-PACKAGES decision 14)
        if: inputs.only == 'pypi-new' && endsWith(inputs.project, '-fux-index')
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: fux-index
          path: dist/fux-index/
          run-id: ${{ needs.gate.outputs.run }}
          github-token: ${{ github.token }}
      - id: one
        name: pypi-new — exactly the named project, at the release's version, and only if PyPI has no such project yet (W-119)
        if: inputs.only == 'pypi-new'
        env:
          RELEASE: ${{ inputs.release }}
          PROJECT: ${{ inputs.project }}
        run: |
          mkdir -p upload
          dir=dist/pypi
          if [[ "$PROJECT" == *-fux-index ]]; then dir=dist/fux-index/pypi; (cd dist/fux-index && sha256sum --strict --quiet -c SHA256SUMS); fi
          for w in "$dir"/*.whl; do
            [ "$(basename "$w" | cut -d- -f1 | tr '_' '-')" = "$PROJECT" ] || continue
            [ "$(basename "$w" | cut -d- -f2)" = "${RELEASE#v}" ] || { echo "::error::$(basename "$w") is not ${RELEASE#v}"; exit 1; }
            cp "$w" upload/
          done
          [ -n "$(ls upload)" ] || { echo "::error::$RELEASE's build has no wheel of $PROJECT"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$PROJECT/json")"
          [ "$code" = 404 ] || { echo "::error::$PROJECT is already on PyPI (HTTP $code): a Release uploads it; pypi-new only creates a project"; exit 1; }
          {
            echo "### PyPI — one new project (W-119)"
            echo "- → create \`$PROJECT\` with $(ls upload) through its pending publisher (arpitarya/codelaw · publish.yml · pypi)."
            echo "- PyPI refuses the upload if no pending publisher names it: register one, then re-run."
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - id: exists
        name: only wheels whose PyPI project exists, or is codelaw (its pending publisher creates it); the rest are named, not failed (L6 decision 9)
        if: github.event_name == 'release'
        run: |
          mkdir -p upload
          {
            echo "### PyPI"
            for w in dist/pypi/*.whl; do
              proj="$(basename "$w" | cut -d- -f1 | tr '_' '-')"
              code="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$proj/json")"
              if [ "$code" = 200 ] || [ "$proj" = codelaw ]; then
                cp "$w" upload/; echo "- ✓ upload \`$proj\`"
              else
                echo "- ⏭ skipped \`$proj\` — not on PyPI yet (HTTP $code); its first upload is by hand"
              fi
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ -n "$(ls upload)" ] || { echo "::error::no wheel to upload"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: upload/
          skip-existing: true

  vscode:
    # W-95: the eight .vsix ci.yml built (artifact `vscode`) to the Visual Studio Marketplace (trusted
    # publishing: no token) and Open VSX (OVSX_PAT, skipped while unset), after the engine. Plain curl:
    # @vscode/vsce and ovsx are not ratified (L2, L11). continue-on-error: a listing problem never fails,
    # or withdraws, the engine's release; read the job summary. A version already listed is skipped.
    needs: [gate, npm]
    if: ${{ !cancelled() && needs.gate.result == 'success' && (github.event_name == 'release' && needs.npm.result == 'success' || inputs.only == 'vscode') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # the OIDC token the Marketplace exchanges for a short-lived credential
      actions: read
    environment:
      name: vscode # tag rule v*; the Marketplace's trusted-publishing policy names this environment
      url: https://marketplace.visualstudio.com/items?itemName=codelaw.codelaw
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: vscode
          path: dist/vscode/
          run-id: ${{ needs.gate.outputs.run }}
          github-token: ${{ github.token }}
      - name: the download is what ci.yml built (SHA256SUMS), at the release version
        run: |
          (cd dist/vscode && sha256sum --strict --quiet -c SHA256SUMS)
          v="$(python3 scripts/version.py)"
          for f in dist/vscode/*.vsix; do
            case "$f" in *"-$v.vsix") ;; *) echo "::error::$f is not $v"; exit 1 ;; esac
          done
      - name: Visual Studio Marketplace — GitHub OIDC token → Marketplace credential → one upload per platform
        run: |
          idt="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=marketplace.visualstudio.com" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          cred="$(curl -fsS -X POST -H "Authorization: FederatedToken $idt" -H 'Content-Type: application/json' -H 'User-Agent: codelaw-publish' \
                    -d '{"publisherName":"codelaw"}' 'https://marketplace.visualstudio.com/_apis/gallery/token?api-version=7.2-preview.1' \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin)["credential"])')"
          echo "::add-mask::$cred"
          auth="$(printf ':%s' "$cred" | base64 | tr -d '\n')"
          echo "### Visual Studio Marketplace" >> "$GITHUB_STEP_SUMMARY"
          bad=0
          for f in dist/vscode/*.vsix; do
            # the first version creates the extension (POST); every other file updates it (PUT)
            code="$(curl -sS -o "$RUNNER_TEMP/m.out" -w '%{http_code}' -X PUT -H "Authorization: Basic $auth" -H 'Content-Type: application/octet-stream' \
                      --data-binary "@$f" 'https://marketplace.visualstudio.com/_apis/gallery/publishers/codelaw/extensions/codelaw?api-version=7.2-preview.2')"
            if [ "${code:0:1}" != 2 ]; then
              code="$(curl -sS -o "$RUNNER_TEMP/m.out" -w '%{http_code}' -X POST -H "Authorization: Basic $auth" -H 'Content-Type: application/octet-stream' \
                        --data-binary "@$f" 'https://marketplace.visualstudio.com/_apis/gallery/extensions?api-version=7.2-preview.2')"
            fi
            if [ "${code:0:1}" = 2 ]; then echo "- ✓ $(basename "$f")" | tee -a "$GITHUB_STEP_SUMMARY"
            elif grep -qiE 'version.{0,40}already exists|already exists.{0,40}version' "$RUNNER_TEMP/m.out"; then echo "- ⏭ $(basename "$f") version already listed" | tee -a "$GITHUB_STEP_SUMMARY"
            else echo "- ✗ $(basename "$f") HTTP $code: $(head -c 600 "$RUNNER_TEMP/m.out")" | tee -a "$GITHUB_STEP_SUMMARY"; bad=1; fi
          done
          [ "$bad" = 0 ]
      - name: Open VSX — skipped while OVSX_PAT is not set (W-117)
        if: always()
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          echo "### Open VSX" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$OVSX_PAT" ] || { echo "- ⏭ skipped: no OVSX_PAT in the vscode environment (W-117)" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          bad=0
          for f in dist/vscode/*.vsix; do
            code="$(curl -sS -o "$RUNNER_TEMP/o.out" -w '%{http_code}' -X POST -H "Authorization: Bearer $OVSX_PAT" -H 'Content-Type: application/octet-stream' \
                      --data-binary "@$f" 'https://open-vsx.org/api/-/publish')"
            if [ "${code:0:1}" = 2 ]; then echo "- ✓ $(basename "$f")" | tee -a "$GITHUB_STEP_SUMMARY"
            elif grep -qi 'already published' "$RUNNER_TEMP/o.out"; then echo "- ⏭ $(basename "$f") already listed" | tee -a "$GITHUB_STEP_SUMMARY"
            else echo "- ✗ $(basename "$f") HTTP $code: $(head -c 300 "$RUNNER_TEMP/o.out")" | tee -a "$GITHUB_STEP_SUMMARY"; bad=1; fi
          done
          [ "$bad" = 0 ]

  attach:
    # The checksums of what was published, on the GitHub Release itself.
    needs: [gate, npm, pypi]
    if: github.event_name == 'release' # a run by hand has no Release to attach to
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/
          run-id: ${{ needs.gate.outputs.run }}
          github-token: ${{ github.token }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

  half-published:
    # L6 decision 9: a release that failed part-way is withdrawn. OIDC tokens can
    # publish but not deprecate or yank, so this names exactly what reached a
    # registry and the one command that withdraws it — the decider runs it.
    needs: [gate, trust, npm, pypi]
    if: failure() && needs.trust.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false # nothing here pushes (W-18)
      - run: bash scripts/withdraw.sh "${GITHUB_REF_NAME#v}" --report | tee -a "$GITHUB_STEP_SUMMARY"
      - run: |
          echo "::error::release ${GITHUB_REF_NAME} is half-published. Do not announce it. Run: scripts/withdraw.sh ${GITHUB_REF_NAME#v}"
          exit 1
