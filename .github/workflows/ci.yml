# CI — every push and PR, and nightly. publish.yml releases ONLY a commit on
# which this workflow concluded `success` on main, and it publishes the `dist`
# artifact this run assembled: nothing is compiled at release time
# (SR-PACKAGES decision 11; W-04).
#
#   test      cargo test --workspace (the law checks: L2 licences, L3 fixtures, L5 network fence, layers)
#   lint      the version copies agree (W-18) · the SR guard replayed from RULE-SINCE ·
#             the work-system checks (W-20) · clippy
#   perf      L8's gate (W-19): `codelaw bench` on the reference workload against
#             perf/budgets.toml — fails only on a budget the decider SET; an
#             unset one (a proposal) is reported in the job summary
#   corpus    level 4 (W-20): every pack's rules over the pinned corpus (scripts/corpus.json),
#             invariants on every file, finding counts against packs/<pack>/corpus.toml
#   build ×8  one maturin wheel per platform; the npm binary is taken OUT of it, so
#             both registries ship the same bytes (L6 decision 2); each runs its
#             binary's --version and every pack's tests on its own platform
#   package   the 17 npm tarballs + 14 wheels, the release checks (SHA256SUMS
#             included); on main, a build attestation of every file publish.yml uploads
#             and, beside it and never in it, the optional Fux index packages (dist/fux-index/,
#             W-34): built by a pinned fux, twice, and checked; nothing publishes them yet
#   smoke ×8  the L6 install matrix and runtime fence on every platform: `dist` is
#             published to a throwaway staging index on localhost and installed
#             from it; npm and PyPI give byte-equal output on the L3 fixtures + a pack
#
# Every `run:` is `bash -eo pipefail` (the defaults below), so a failure inside
# a pipe — `cargo clippy … | tee` — fails its step (W-18). Every action is
# pinned by commit SHA; the comment names its release.
#
# 🔴 Speed — a verdict already earned is not earned again. Each Rust job keys
# its result by the inputs that can change it (the sources it compiles, every
# file a test reads — records, scripts, packaging, workflows included — and the
# pinned rustc of rust-toolchain.toml that compiles them; W-24):
#   - build: the WHEEL is cached under that key. A push that changes no input —
#     records, docs, packs, work/ — restores the wheel instead of compiling it.
#     The binary's --version and every pack's tests still run on it, every time.
#   - test / clippy: a green result saves a marker under that key; the same key
#     on a later push skips the run.
#   - perf: no verdict is kept — it runs only when what it times changed (W-24).
# ⚠ Only push and pull_request READ a saved verdict. The nightly run and a
# manual dispatch always run everything fresh — the backstop for a runner image
# changing what a key cannot see.
name: ci
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * *' # 02:00 IST
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
defaults:
  run:
    shell: bash # an explicit `bash` is `bash --noprofile --norc -eo pipefail`; the implicit default has no pipefail
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  PYTHONUTF8: '1'
  MATURIN_VERSION: '1.15.0'
  # push / PR may reuse a verdict its key already earned; nightly and dispatch never do
  REUSE: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
jobs:
  test:
    # A same-repo PR is the sha its branch push already ran.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false # nothing here pushes (W-18)
      - id: rustc # the pinned toolchain, read from the file — nothing is installed to learn it
        run: echo "v=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - id: verdict
        if: env.REUSE == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .verdict
          key: test-${{ steps.rustc.outputs.v }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**', 'fixtures/**', 'packs/**', 'templates/**', 'perf/**', 'records/[0-9]*.md', 'scripts/**', 'packaging/**', '.github/workflows/**') }}
          lookup-only: true
      - if: steps.verdict.outputs.cache-hit == 'true'
        run: echo "::notice title=test::skipped — cargo test already passed on these exact sources with rustc ${{ steps.rustc.outputs.v }}"
      - if: steps.verdict.outputs.cache-hit != 'true'
        run: rustup toolchain install ${{ steps.rustc.outputs.v }} --profile minimal --component clippy --no-self-update
      - if: steps.verdict.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - if: steps.verdict.outputs.cache-hit != 'true'
        run: cargo test --workspace --locked
        env:
          # the L5 network fence fails here instead of skipping (SR-LAW-5)
          CODELAW_REQUIRE_NETWORK_FENCE: '1'
      - if: steps.verdict.outputs.cache-hit != 'true'
        run: mkdir -p .verdict && echo "${{ github.sha }}" > .verdict/sha
      - if: steps.verdict.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .verdict
          key: test-${{ steps.rustc.outputs.v }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**', 'fixtures/**', 'packs/**', 'templates/**', 'perf/**', 'records/[0-9]*.md', 'scripts/**', 'packaging/**', '.github/workflows/**') }}

  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false # nothing here pushes (W-18)
          fetch-depth: 0 # the SR guard replays every commit since records/RULE-SINCE
      - name: every version copy agrees (L6 decision 9, W-18)
        run: python3 scripts/version.py --check
      - name: the SR guard, replayed over history (SR-WORK-OWNERSHIP decision 7)
        run: |
          base="$(grep -v '^#' records/RULE-SINCE)"
          git rev-parse --verify --quiet "$base^{commit}" >/dev/null || {
            echo "::error title=SR guard::records/RULE-SINCE names '$base', which is not a commit in this history"
            exit 1
          }
          commits="$(git rev-list --no-merges "$base"..HEAD)" # an assignment: a failing rev-list fails the step
          n=0
          for c in $commits; do
            SR_GUARD_COMMIT=$c bash scripts/sr-guard.sh; n=$((n + 1))
          done
          echo "✔ $n commits since ${base::8}: each touched the records its components need"
      - name: the work system's checks (SR-WORK-OPEN-QUEUE, -OWNERSHIP, -REGISTRY, -ARCHIVE; W-20)
        run: |
          python3 scripts/check-work-system.py --self-test
          python3 scripts/check-open-work-inbox.py
          python3 scripts/check-work-system.py
      - name: the public docs agree with the tree (scripts/docs-sync.py; SR-WORK-REGISTRY, W-26)
        run: python3 scripts/docs-sync.py --check
      - id: rustc # the pinned toolchain, read from the file — nothing is installed to learn it
        run: echo "v=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - id: verdict
        if: env.REUSE == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .verdict
          key: clippy-${{ steps.rustc.outputs.v }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**', 'templates/**', 'perf/**', 'packs/**') }}
          lookup-only: true
      - if: steps.verdict.outputs.cache-hit == 'true'
        run: echo "::notice title=clippy::skipped — clippy already passed on these exact sources with rustc ${{ steps.rustc.outputs.v }}"
      - if: steps.verdict.outputs.cache-hit != 'true'
        run: rustup toolchain install ${{ steps.rustc.outputs.v }} --profile minimal --component clippy --no-self-update
      - if: steps.verdict.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - name: cargo clippy --workspace --all-targets -- -D warnings
        if: steps.verdict.outputs.cache-hit != 'true'
        run: |
          cargo clippy --workspace --all-targets --locked --message-format=short -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.txt" || {
            echo "::error title=clippy::$(grep -E '(error|warning)' "$RUNNER_TEMP/clippy.txt" | head -30 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            exit 1
          }
      - if: steps.verdict.outputs.cache-hit != 'true'
        run: mkdir -p .verdict && echo "${{ github.sha }}" > .verdict/sha
      - if: steps.verdict.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .verdict
          key: clippy-${{ steps.rustc.outputs.v }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**', 'templates/**', 'perf/**', 'packs/**') }}

  perf:
    # L8's perf gate (SR-LAW-8 decision 7; W-19). `codelaw bench` times every
    # L8 operation on the reference workload (generated from its seed, no
    # network) and compares each p95 with perf/budgets.toml: exit 1 when one
    # is over a budget the decider SET (`budget = <number>`). A `budget =
    # "unset"` entry — every one until the decider rules; a `proposed` value is
    # never compared — is reported in the job summary and fails nothing
    # (decision 6). No verdict is reused: the timing is what is checked.
    # A push or PR that changed nothing it times — the engine, its toolchain,
    # the packs it loads, perf/, this file — skips it (W-24); the nightly run
    # and a manual dispatch always run it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04 # L8 reference machine (the decider, 2026-10-24); never ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false # nothing here pushes (W-18)
      - id: changed # an unknown base (a new branch, a force push, a failed fetch) runs it
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          run=true
          if [ "$REUSE" = true ] && [ -n "$BASE" ] && [ -n "${BASE//0/}" ] && git fetch -q --depth=1 origin "$BASE" 2>/dev/null; then
            git diff --quiet "$BASE" HEAD -- crates Cargo.toml Cargo.lock rust-toolchain.toml perf packs .github/workflows/ci.yml && run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          [ "$run" = true ] || echo "::notice title=perf::skipped — nothing it times changed since ${BASE::8}"
      - id: rustc # the pinned toolchain, read from the file — nothing is installed to learn it
        run: echo "v=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.run == 'true'
        run: rustup toolchain install ${{ steps.rustc.outputs.v }} --profile minimal --no-self-update
      - if: steps.changed.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - if: steps.changed.outputs.run == 'true'
        run: cargo build --release --locked -p codelaw-cli
      - name: the machine measured (a budget names its reference machine, L8 decision 2)
        if: steps.changed.outputs.run == 'true'
        run: |
          {
            echo '### perf: the runner'
            echo '```'
            lscpu | grep -E '^(Model name|CPU\(s\)|Thread|Core|Socket)' || true
            free -m | sed -n '1,2p'
            echo "load: $(cut -d' ' -f1-3 /proc/loadavg)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: the three pinned real repos (L8 decision 2; scripts/corpus.json)
        if: steps.changed.outputs.run == 'true'
        run: python3 scripts/corpus.py fetch --dir "$RUNNER_TEMP/corpus" --repo djangoproject.com --repo full-stack-fastapi-template --repo html5-boilerplate
      - name: codelaw bench --budgets perf/budgets.toml
        if: steps.changed.outputs.run == 'true'
        run: |
          code=0
          repos=()
          for r in djangoproject.com full-stack-fastapi-template html5-boilerplate; do repos+=(--repo "$RUNNER_TEMP/corpus/repos/$r"); done
          target/release/codelaw bench --workload "$RUNNER_TEMP/bench" --packs packs --budgets perf/budgets.toml "${repos[@]}" --output "$RUNNER_TEMP/bench.json" 2>&1 | tee "$RUNNER_TEMP/bench.txt" || code=$?
          {
            echo '### perf: L8 operations (each p95 against perf/budgets.toml; an unset budget is reported only)'
            echo '```'
            cat "$RUNNER_TEMP/bench.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" = 1 ]; then
            echo "::error title=L8 perf gate::a p95 is over a budget the decider set in perf/budgets.toml; optimise it — a budget is never loosened (L8 decision 5)"
          fi
          exit "$code"
      - if: always() && steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: perf-bench
          path: ${{ runner.temp }}/bench.json
          if-no-files-found: ignore

  corpus:
    # Level 4 of `codelaw test` over the pinned corpus (SR-RULE-AUTHORING
    # decision 4; W-20). scripts/corpus.json pins each repository to a full
    # commit; `fetch` checks each one out and refuses one whose licence file is
    # not the permissive licence it declares (SR-LAW-2). `run` holds every
    # pack's rules to the invariants on every file and each rule's finding
    # count to packs/<pack>/corpus.toml. A count that moved fails: rerun
    # `scripts/corpus.py run --update` and commit the reviewed diff.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false # nothing here pushes (W-18)
      - name: the corpus manifest (pinned commits, permissive licences, every pack covered)
        run: python3 scripts/corpus.py --self-test
      - id: rustc # the pinned toolchain, read from the file — nothing is installed to learn it
        run: echo "v=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - id: verdict
        if: env.REUSE == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .verdict
          key: corpus-${{ steps.rustc.outputs.v }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**', 'packs/**', 'scripts/corpus.*') }}
          lookup-only: true
      - if: steps.verdict.outputs.cache-hit == 'true'
        run: echo "::notice title=corpus::skipped — the corpus run already passed on these exact sources with rustc ${{ steps.rustc.outputs.v }}"
      - if: steps.verdict.outputs.cache-hit != 'true'
        run: rustup toolchain install ${{ steps.rustc.outputs.v }} --profile minimal --no-self-update
      - if: steps.verdict.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - if: steps.verdict.outputs.cache-hit != 'true'
        run: cargo build --release --locked -p codelaw-cli
      - name: check out the pinned corpus
        if: steps.verdict.outputs.cache-hit != 'true'
        run: python3 scripts/corpus.py fetch --dir "$RUNNER_TEMP/corpus"
      - name: codelaw test packs/<pack> --corpus … --snapshot packs/<pack>/corpus.toml
        if: steps.verdict.outputs.cache-hit != 'true'
        run: |
          code=0
          python3 scripts/corpus.py run --binary target/release/codelaw --dir "$RUNNER_TEMP/corpus" 2>&1 | tee "$RUNNER_TEMP/corpus.txt" || code=$?
          { echo '### corpus: level 4 per pack'; echo '```'; cat "$RUNNER_TEMP/corpus.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = 0 ] || echo "::error title=corpus::a pack's corpus run failed — an invariant broke on a real file, or a finding count moved (rerun scripts/corpus.py run --update and review the diff)"
          exit "$code"
      - if: steps.verdict.outputs.cache-hit != 'true'
        run: mkdir -p .verdict && echo "${{ github.sha }}" > .verdict/sha
      - if: steps.verdict.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .verdict
          key: corpus-${{ steps.rustc.outputs.v }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**', 'packs/**', 'scripts/corpus.*') }}

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    name: build ${{ matrix.key }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The keys and targets are scripts/package.py's TARGETS; `package` fails
        # if this list and that one differ.
        include:
          - { key: linux-x64-gnu, target: x86_64-unknown-linux-gnu, os: ubuntu-latest, maturin: --zig --compatibility manylinux2014 }
          - { key: linux-x64-musl, target: x86_64-unknown-linux-musl, os: ubuntu-latest, maturin: --zig }
          - { key: linux-arm64-gnu, target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, maturin: --zig --compatibility manylinux2014 }
          - { key: linux-arm64-musl, target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, maturin: --zig }
          - { key: darwin-arm64, target: aarch64-apple-darwin, os: macos-latest, maturin: '' }
          - { key: darwin-x64, target: x86_64-apple-darwin, os: macos-latest, maturin: '' } # cross-built; runs under Rosetta
          - { key: win32-x64, target: x86_64-pc-windows-msvc, os: windows-latest, maturin: '' }
          - { key: win32-arm64, target: aarch64-pc-windows-msvc, os: windows-11-arm, maturin: '' }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false # nothing here pushes (W-18)
      - id: rustc # the pinned toolchain, read from the file — nothing is installed to learn it
        run: echo "v=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - id: wheel
        # Everything that goes into the wheel: the engine's sources, the Python
        # module, the licence and README it carries, and these build steps.
        if: env.REUSE == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/wheel
          key: wheel-${{ matrix.key }}-${{ steps.rustc.outputs.v }}-${{ env.MATURIN_VERSION }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock', 'crates/**', 'templates/**', 'packaging/python/**', 'packaging/README.md', 'LICENSE', 'scripts/package.py', '.github/workflows/ci.yml') }}
      - if: steps.wheel.outputs.cache-hit == 'true'
        run: echo "::notice title=build ${{ matrix.key }}::reused the wheel built from these exact sources with rustc ${{ steps.rustc.outputs.v }}"
      - if: steps.wheel.outputs.cache-hit != 'true'
        run: rustup toolchain install ${{ steps.rustc.outputs.v }} --profile minimal --target ${{ matrix.target }} --no-self-update
      - if: steps.wheel.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 — the scripts need it on a reused wheel too
        with:
          python-version: '3.12'
      - name: maturin${{ contains(matrix.maturin, 'zig') && ' + zig' || '' }}
        if: steps.wheel.outputs.cache-hit != 'true'
        run: pip install --disable-pip-version-check -q "maturin${{ contains(matrix.maturin, 'zig') && '[zig]' || '' }}==$MATURIN_VERSION"
      - if: steps.wheel.outputs.cache-hit != 'true'
        run: python scripts/package.py prepare-wheel
      - name: the wheel (maturin's bin bindings, SR-PACKAGES decision 5)
        if: steps.wheel.outputs.cache-hit != 'true'
        working-directory: packaging/python
        run: maturin build --release --locked --target ${{ matrix.target }} ${{ matrix.maturin }} --out ../../out/wheel
      - if: steps.wheel.outputs.cache-hit != 'true' && env.REUSE == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/wheel
          key: ${{ steps.wheel.outputs.cache-primary-key }}
      - name: the npm binary is the wheel's binary
        run: python scripts/package.py extract out/wheel/*.whl out/bin/${{ matrix.key }}
      - name: the binary runs, says its version, and passes every pack's tests
        run: |
          b="out/bin/${{ matrix.key }}/codelaw"; [ -f "$b.exe" ] && b="$b.exe"
          python scripts/version.py --check --binary "$b"
          # Every pack runs, and a failing pack prints its failing checks: the
          # last line alone said "1 failed" on win32 and not which check (W-72).
          rc=0
          for p in packs/*/; do
            out="$("$b" test "$p" 2>&1)" || { echo "$out" | grep -A6 '✖' || true; rc=1; }
            echo "$out" | tail -1
            "$b" rules lint "$p" | tail -1
          done
          exit "$rc"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-${{ matrix.key }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  package:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # the build attestation's signing certificate (main only)
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false # nothing here pushes (W-18)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: build-*
          path: out/
          merge-multiple: true
      - name: assemble every package (SR-PACKAGES decisions 3-9)
        run: python3 scripts/package.py assemble --bins out/bin --wheels out/wheel --out dist
      - name: the release checks — names (B-020), one version, zero deps, licence, one binary, pack parity, SHA256SUMS
        run: python3 scripts/package.py check dist
      - name: the engine is complete enough to release — format, mcp and lsp present (L6 decision 3, L7)
        run: python3 scripts/law-gate.py dist
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12' # fux-engine needs >= 3.12
      - name: the optional Fux index packages (L6 decision 12, SR-PACKAGES decision 14) — a pinned fux, built twice, checked
        # Fux is a build tool of this job only; the version is scripts/fux-index.py's FUX_VERSION.
        # The output is dist/fux-index/, beside the release set and never in it: publish.yml
        # does not upload it until the decider has reserved the names (RELEASING.md).
        run: |
          python3 -m venv "$RUNNER_TEMP/fux"
          "$RUNNER_TEMP/fux/bin/pip" install --quiet "fux-engine==$(sed -n 's/^FUX_VERSION = "\([^"]*\)".*/\1/p' scripts/fux-index.py)"
          python3 scripts/fux-index.py assemble --out dist --fux "$RUNNER_TEMP/fux/bin/fux"
          python3 scripts/fux-index.py check dist
          python3 scripts/package.py check dist
      - name: attest every file publish.yml may upload (SR-PACKAGES decision 11) — main pushes only
        # publish.yml's gate verifies each file against this attestation, so it
        # uploads exactly what this run built, from this commit, on main.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dist
          path: |
            dist/npm/*.tgz
            dist/pypi/*.whl
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: fux-index
          path: |
            dist/fux-index/npm/*.tgz
            dist/fux-index/pypi/*.whl
            dist/fux-index/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  smoke:
    # L6 "How L6 is enforced": the install matrix and the runtime fence, on each
    # of the eight platforms. smoke.sh publishes the checked `dist` to a staging
    # index on 127.0.0.1 (scripts/staging-index.py: an npm registry and a PyPI
    # simple index, the standard library only) and installs codelaw from it by
    # name, as a user does: npm and pip each pick the package for the machine.
    # Nothing is published to any other registry (W-18).
    # The musl platforms run in a clean Alpine container on the matching host.
    needs: package
    name: smoke ${{ matrix.key }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: linux-x64-gnu, os: ubuntu-latest, alpine: '' }
          - { key: linux-x64-musl, os: ubuntu-latest, alpine: '3.22' }
          - { key: linux-arm64-gnu, os: ubuntu-24.04-arm, alpine: '' }
          - { key: linux-arm64-musl, os: ubuntu-24.04-arm, alpine: '3.22' }
          - { key: darwin-arm64, os: macos-latest, alpine: '' }
          - { key: darwin-x64, os: macos-15-intel, alpine: '' } # native x64: npm and pip pick by the host's arch
          - { key: win32-x64, os: windows-latest, alpine: '' }
          - { key: win32-arm64, os: windows-11-arm, alpine: '' }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false # nothing here pushes (W-18)
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/
      - if: matrix.alpine == ''
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - if: matrix.alpine == ''
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: npm (no Python on PATH) and PyPI (no Node on PATH) give byte-equal output on ${{ matrix.key }}
        if: matrix.alpine == ''
        run: bash scripts/smoke.sh dist ${{ matrix.key }}
      - name: the same, in a clean Alpine ${{ matrix.alpine }} container (musl)
        if: matrix.alpine != ''
        run: |
          docker run --rm -v "$PWD:/w" -w /w "alpine:${{ matrix.alpine }}" sh -euc '
            apk add --no-cache -q bash git nodejs npm python3
            bash scripts/smoke.sh dist ${{ matrix.key }}'

  msrv:
    # The workspace's `rust-version` is true (W-27, SR-PACKAGES decision 13):
    # the whole workspace type-checks on exactly that compiler. It is the floor
    # the dependencies set (ruff_* 0.0.18 declare 1.97); the release itself is
    # built with rust-toolchain.toml's pinned compiler, so this is informational
    # for `cargo install` users and never a release input.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false # nothing here pushes (W-18)
      - id: msrv
        run: echo "v=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install ${{ steps.msrv.outputs.v }} --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv-${{ steps.msrv.outputs.v }}
          cache-on-failure: true
      - name: cargo +${{ steps.msrv.outputs.v }} check --workspace
        run: cargo +${{ steps.msrv.outputs.v }} check --workspace --all-targets --locked
