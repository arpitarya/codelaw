name: Rule request
description: Ask for a new rule, or a port of one from another linter — or share a rule the codelaw-port-rule skill ported into your project.
title: "[rule] "
labels: ["rule request"]
body:
  - type: markdown
    attributes:
      value: |
        Layout (indentation, spacing, quotes, line length) is the formatter's job, not a rule's. Ask for a `[format]` option instead.
  - type: textarea
    id: convention
    attributes:
      label: The convention the rule enforces
      description: One or two sentences, and why it matters.
    validations:
      required: true
  - type: dropdown
    id: languages
    attributes:
      label: Languages
      multiple: true
      options:
        - JavaScript
        - TypeScript
        - Python
        - CSS
        - HTML
        - JSON
        - YAML
        - TOML
        - Markdown
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: The original rule, if it exists elsewhere
      description: A link to the rule in ESLint, typescript-eslint, Ruff, Pylint, stylelint, Biome, html-validate, markdownlint or any other tool.
  - type: input
    id: ported_from
    attributes:
      label: Ported from
      description: "For a port: the source rule as `<tool>/<rule>`, the value a rule file's `ported_from:` takes (`eslint/no-nested-ternary`, `pylint/global-statement`). Title the issue `port: <tool>/<rule>`; maintainers count requests by it."
      placeholder: eslint/no-nested-ternary
  - type: textarea
    id: dont
    attributes:
      label: Code it should report (Don't)
      render: text
    validations:
      required: true
  - type: textarea
    id: do
    attributes:
      label: The same code, correct (Do)
      render: text
    validations:
      required: true
  - type: dropdown
    id: fix
    attributes:
      label: How it can be fixed
      description: Every codelaw rule carries a fix.
      options:
        - Automatically — the edit is always safe
        - As a suggestion — the edit is mechanical but may change behaviour
        - By hand — it needs a decision; I describe the steps below
        - Not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Fix steps, or anything else
  - type: textarea
    id: rule_file
    attributes:
      label: The ported rule file, if you have one
      description: "The `.codelaw/rules/<namespace>/<name>.md` the codelaw-port-rule skill wrote in your project, green under `codelaw test`. Nothing is sent unless you submit this form."
      render: markdown
