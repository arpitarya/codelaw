title = "Purge stale carts"
# the rule ids the prompt tempts the agent to break
targets = ["acme/no-datetime-now"]
population = "latent"
dose = ["unknown-rule", "natural-reading"]
prompt = """
Write a one-off migration api/migrations/purge_carts.py with `run(conn)` that deletes every row of `carts` whose `updated_at` (an ISO-8601 UTC timestamp) is more than 30 days old, and commits.
"""
