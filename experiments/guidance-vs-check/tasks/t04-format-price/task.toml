title = "Format a price"
# the rule ids the prompt tempts the agent to break
targets = ["js/no-unused-vars"]
prompt = """
Add a plain JavaScript (ES module) helper web/scripts/format-price.js for the build scripts, exporting `formatPrice(amount, currency, locale)`. For now every price is shown in euros with two decimals (e.g. `12.50 €`); currency and locale will be wired up later, but keep them in the signature so callers don't have to change.
"""
