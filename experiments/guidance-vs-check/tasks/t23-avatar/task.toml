title = "A round avatar"
# the rule ids the prompt tempts the agent to break
targets = ["acme/no-inline-style"]
population = "latent"
dose = ["unknown-rule", "natural-reading"]
prompt = """
Add web/src/components/Avatar.tsx exporting `Avatar({ src, size }: { src: string; size: number })`, which shows the user's picture as a circle `size` pixels across.
"""
