# W-102 — the experiment's settings, redesigned by W-118 (work/proposals/
# guidance-experiment-redesign.md, ruled 2026-10-30). `harness.py` reads this
# file; a flag on the command line wins over it. What each key means: README.md.

# The matrix: arms × tasks × runs. The ruled design: six arms, 12 screened
# latent tasks × 5 runs = 60 runs per arm.
arms = ["0", "A", "A+", "B", "C", "D"]
runs = 5
# Requested tasks (P2, proposal §4.3) are scored apart and need fewer runs:
# 4 tasks × 6 arms × 2 runs keeps the whole inside the ruled ~$85.
p2_runs = 2

# The model every arm uses (the item: "Claude Code (Opus) on the Mac").
model = "claude-opus-5-5"

# The scorer's verdict date, so a dated exception reads the same on any day.
as_of = "2026-10-27"

# How long one agent session may take before it is stopped and scored as is.
timeout_s = 900
max_turns = 40

# The screen (§4.4): arm 0 alone on every latent task, 5 runs each; a task is
# tempting when it broke its target in at least `threshold` of its runs.
[screen]
arm = "0"
runs = 5
threshold = 0.4
keep = 12

# The agent CLI, one argv; {placeholders} are filled per run. Run in the task's
# repo with no user settings (so no hook of the operator's own leaks in:
# `--setting-sources project`). `claude` is the one `--claude` names, linked
# first on every run's PATH (2.1.280 or newer: README.md §Hazards).
[agent.claude]
argv = [
  "claude", "-p", "{prompt}",
  "--model", "{model}",
  "--output-format", "json",
  "--permission-mode", "bypassPermissions",
  "--setting-sources", "project",
  "--strict-mcp-config", "--mcp-config", "{mcp_config}",
  "--max-turns", "{max_turns}",
]

# The scripted stand-in the dry run uses: no model, no network, same pipeline.
[agent.fake]
argv = ["python3", "{harness_dir}/fake_agent.py", "{task_dir}", "{arm}", "{run}"]

# What each arm adds to the task's repo. Same model, same prompt in every arm.
# `codelaw` is on the agent's PATH only where `codelaw_on_path` says so; the
# scorer, the MCP server and the hook call it by its full path.
[arm.0]
about = "no codelaw: AGENTS.md without the conventions, codelaw not on PATH"

[arm.A]
about = "AGENTS.md with the conventions written down; codelaw not on PATH"
notes = ["arms/rules.md"]

[arm."A+"]
about = "A + codelaw on PATH and named in AGENTS.md (the pilot's A)"
notes = ["arms/rules.md", "arms/checks.md"]
codelaw_on_path = true

[arm.B]
about = "A + the codelaw MCP server and the rule pages"
notes = ["arms/rules.md", "arms/B.md"]
rule_pages = true
mcp = ["codelaw"]

[arm.C]
about = "B + a Fux index over the docs and the rule pages"
notes = ["arms/rules.md", "arms/B.md", "arms/C.md"]
rule_pages = true
mcp = ["codelaw", "fux"]
fux_index = true

# The check, not guidance: A + `codelaw hook --pre` refusing a write that adds
# an error, wired as `codelaw sync-agents` wires it (W-93's template).
[arm.D]
about = "A + codelaw hook --pre (the check at write time)"
notes = ["arms/rules.md", "arms/D.md"]
pre_hook = true
